<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 - 仓库现场5S检查平台</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <h1>🏭 仓库现场 5S 检查平台</h1>
    <p class="sub">整理 · 整顿 · 清扫 · 清洁 · 素养</p>
    <form onsubmit="return doLogin(this)">
      <input type="hidden" name="back" value="{$back|default=''}">
      <div class="form-row">
        <label>账号</label>
        <input type="text" name="username" placeholder="请输入账号" autofocus required>
      </div>
      <div class="form-row">
        <label>密码</label>
        <input type="password" name="password" placeholder="请输入密码" required>
      </div>
      <button type="submit" class="btn block">登 录</button>
    </form>
    <div class="login-roles mt16">
      <div>管理员<br><b>admin</b></div>
      <div>老板<br><b>boss</b></div>
      <div>员工<br><b>zhangsan</b></div>
    </div>
    <p class="center muted" style="font-size:12px">演示账号密码统一为 <b>123456</b></p>
  </div>
</div>
<script>
function doLogin(form){
  fetch('/login', {method:'POST', body:new FormData(form)})
    .then(function(r){return r.json();})
    .then(function(res){
      if(res.code===0){ location.href = res.url; }
      else { alert(res.msg||'登录失败'); }
    }).catch(function(){ alert('网络错误'); });
  return false;
}
</script>
</body>
</html>
