{include file="common/header" /}
<div class="page-head"><h2>检查项管理</h2></div>

<div class="card">
  <form method="post" action="/admin/item" class="inline-form">
    <input type="text" name="name" placeholder="检查项名称，如：通道堆放杂物" required>
    <select name="category">
      {volist name="categories" id="c"}
      <option value="{$c}">{$c}</option>
      {/volist}
    </select>
    <input type="number" name="deduct_score" step="0.5" min="0" value="1" title="扣分标准" placeholder="扣分">
    <button class="btn btn-primary" type="submit">＋ 添加检查项</button>
  </form>
</div>

<div class="card table-card">
<table class="table">
  <thead><tr><th>ID</th><th>检查项</th><th>5S分类</th><th>扣分标准</th><th>状态</th><th>操作</th></tr></thead>
  <tbody>
  {volist name="items" id="it"}
    <tr>
      <td>{$it.id}</td>
      <td>{$it.name}</td>
      <td><span class="tag">{$it.category}</span></td>
      <td>{:(float)$it['deduct_score']} 分</td>
      <td>
        {if condition="$it.status eq 1"}<span class="badge badge-ok">启用</span>
        {else /}<span class="badge">停用</span>{/if}
      </td>
      <td>
        <form method="post" action="/admin/item/toggle/{$it.id}">
          <button class="btn btn-sm" type="submit">{if condition="$it.status eq 1"}停用{else /}启用{/if}</button>
        </form>
      </td>
    </tr>
  {/volist}
  </tbody>
</table>
</div>
{include file="common/footer" /}
