{include file="common/header" /}
<div class="page-head"><h2>发布问题</h2></div>
<div class="card form-card">
<form method="post" action="/admin/inspection" enctype="multipart/form-data">
  <div class="form-row">
    <label>所属区域 *</label>
    <select name="area_id" required>
      <option value="">请选择区域</option>
      {volist name="areas" id="a"}
      <option value="{$a.id}">{$a.name}</option>
      {/volist}
    </select>
  </div>
  <div class="form-row">
    <label>检查项 *</label>
    <select name="item_id" id="itemSelect" required>
      <option value="">请选择检查项</option>
      {volist name="items" id="it"}
      <option value="{$it.id}" data-score="{$it.deduct_score}">[{$it.category}] {$it.name}（标准扣{:(float)$it['deduct_score']}分）</option>
      {/volist}
    </select>
  </div>
  <div class="form-row">
    <label>本次扣分</label>
    <input type="number" name="deduct_score" id="scoreInput" step="0.5" min="0" placeholder="留空则按检查项标准扣分">
  </div>
  <div class="form-row">
    <label>指派整改人</label>
    <select name="assignee_id">
      <option value="">不指定（员工扫码均可整改）</option>
      {volist name="staff" id="s"}
      <option value="{$s.id}">{$s.real_name}</option>
      {/volist}
    </select>
  </div>
  <div class="form-row">
    <label>问题图片 *</label>
    <input type="file" name="image" accept="image/*" capture="environment" required onchange="previewImg(this,'prevImg')">
    <img id="prevImg" class="preview hidden" alt="预览">
  </div>
  <div class="form-row">
    <label>问题描述</label>
    <textarea name="remark" rows="3" placeholder="补充说明问题情况（可选）"></textarea>
  </div>
  <button class="btn btn-primary" type="submit">提交发布</button>
  <a class="btn" href="/admin/inspection">返回</a>
</form>
</div>
<script>
function previewImg(input, id) {
  var img = document.getElementById(id);
  if (input.files && input.files[0]) {
    img.src = URL.createObjectURL(input.files[0]);
    img.classList.remove('hidden');
  }
}
document.getElementById('itemSelect').addEventListener('change', function () {
  var s = this.options[this.selectedIndex].dataset.score;
  if (s !== undefined) document.getElementById('scoreInput').value = parseFloat(s);
});
</script>
{include file="common/footer" /}
