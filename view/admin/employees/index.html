{extend name="layout/base" /}
{block name="title"}员工管理{/block}
{block name="body"}
<div class="card-title-row"><h2>仓库员工（扫码整改人）</h2></div>

<div class="card">
<form class="filter-bar" method="post" action="{:url('/admin/employees')}">
    <div class="field"><label>姓名 *</label><input type="text" name="name" required placeholder="员工姓名"></div>
    <div class="field"><label>工号</label><input type="text" name="job_no" placeholder="WH008"></div>
    <div class="field"><label>手机号</label><input type="tel" name="phone" placeholder="选填"></div>
    <div class="field"><label>所属区域</label>
        <select name="area_id">
            <option value="0">— 未分配 —</option>
            {volist name="areas" id="a"}<option value="{$a.id}">{$a.name}</option>{/volist}
        </select>
    </div>
    <div class="field"><label>整改口令 *</label><input type="text" name="pin" value="1234" maxlength="4" pattern="\d{4}" style="width:110px;min-width:0;" placeholder="4位数字"></div>
    <button class="btn" type="submit">添加员工</button>
</form>
<p class="muted" style="font-size:12px;">员工在扫码整改页选择本人并输入此 4 位口令，作为整改身份确认。</p>
</div>

<div class="card">
<div class="table-wrap">
<table class="tbl" id="empTable">
    <thead><tr><th>ID</th><th>姓名</th><th>工号</th><th>手机</th><th>所属区域</th>
        <th>重置口令（留空不改）</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>
    {volist name="list" id="e"}
    <tr data-id="{$e.id}">
        <td>{$e.id}</td>
        <td><input type="text" data-name="name" value="{$e.name}" required style="width:90px;"></td>
        <td><input type="text" data-name="job_no" value="{$e.job_no|default=''}" style="width:90px;"></td>
        <td><input type="tel" data-name="phone" value="{$e.phone|default=''}" style="width:120px;"></td>
        <td>
            <select data-name="area_id" style="width:130px;">
                <option value="0">— 未分配 —</option>
                {volist name="areas" id="a"}
                <option value="{$a.id}" {if $e.area_id==$a.id}selected{/if}>{$a.name}</option>
                {/volist}
            </select>
        </td>
        <td><input type="text" data-name="pin" maxlength="4" pattern="\d{4}" placeholder="4位数字" style="width:110px;"></td>
        <td>
            <select data-name="status" style="width:80px;">
                <option value="1" {if $e.status==1}selected{/if}>在职</option>
                <option value="0" {if $e.status==0}selected{/if}>离职</option>
            </select>
        </td>
        <td style="white-space:nowrap;">
            <button class="btn btn-sm js-save" type="button">保存</button>
            <button class="btn btn-sm btn-danger js-del" type="button">删除</button>
        </td>
    </tr>
    {/volist}
    </tbody>
</table>
</div>
<div class="pagination">{$list->render()|raw}</div>
</div>
{/block}

{block name="script"}
<script>
document.getElementById('empTable').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button');
    if (!btn) return;
    var tr = btn.closest('tr');
    var id = tr.dataset.id;

    if (btn.classList.contains('js-save')) {
        var data = {};
        tr.querySelectorAll('[data-name]').forEach(function (el) { data[el.dataset.name] = el.value; });
        fetch('/admin/employees/' + id, {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-Requested-With': 'fetch'},
            body: JSON.stringify(data)
        }).then(function (r) { return r.json(); }).then(function (res) {
            if (res.code === 0) { location.reload(); } else { alert(res.msg || '保存失败'); }
        });
    }
    if (btn.classList.contains('js-del')) {
        if (!confirm('确定删除该员工？')) return;
        fetch('/admin/employees/' + id + '/delete', {method: 'POST'})
            .then(function (r) { return r.json(); }).then(function (res) {
                if (res.code === 0) { location.reload(); } else { alert(res.msg || '删除失败'); }
            });
    }
});
</script>
{/block}
