{extend name="layout/base" /}
{block name="title"}登录 · 仓库 5S 检查{/block}
{block name="body"}
<div class="login-wrap">
    <div class="login-card">
        <div class="login-logo">🏭</div>
        <h1>仓库现场 5S 检查</h1>
        <p class="sub">管理员 / 老板登录入口</p>

        {if session('error')}<div class="alert alert-danger">{:session('error')}</div>{/if}

        <form method="post" action="{:url('/login')}">
            <div class="form-row">
                <label>账号</label>
                <input type="text" name="username" required autofocus placeholder="请输入账号">
            </div>
            <div class="form-row">
                <label>密码</label>
                <input type="password" name="password" required placeholder="请输入密码">
            </div>
            <button class="btn btn-block" type="submit">登 录</button>
        </form>
        <p class="login-tip">
            默认管理员 admin / admin123<br>
            默认老板账号 boss / boss123（只看看板）<br>
            仓库员工无需登录，扫描现场二维码即可整改
        </p>
    </div>
</div>
{/block}
